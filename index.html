<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bagsy</title>
<meta name="theme-color" content="#F1F3F2">
<meta name="description" content="Save for a trip together. Each of you bagsies your part.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bagsy">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* VOICE: calm, plain-English money app for two people saving for one trip.
   IDEA: the trip is a suitcase packed in parts; each person bagsies their part.
   PICTURE: the Lisbon evening masthead on the trip, 3D-style part objects in rows.
   COLOUR and TYPE: Bagsy design system tokens, light mode only; Inter with tabular figures.
   LAYOUT: one 390px phone column, floating glass tab bar, bottom sheets for settings. */
:root{color-scheme:light;
--surface-page:#F1F3F2;--surface-card:#FFFFFF;--ink:#111214;--ink-muted:#5E636A;--line-subtle:#ECEEED;--line:#DADEDC;--line-control:#8C928F;
--yellow:#FFC53D;--yellow-soft:#FFF6DB;--brass:#C29330;--brass-deep:#8C6A24;--brass-light:#E2C27A;--brass-darkest:#5C4515;--track:#EFEAE0;
--ok:#137A3F;--behind:#A4520C;--notice-icon:#8A5A00;--notice-ink:#3D3112;--masthead:#22408C;--on-mast-muted:#D5DEFA;--ok-mast:#8BE6B0;
--shadow-card:0 2px 12px rgba(17,18,20,.06),0 1px 2px rgba(17,18,20,.04);--shadow-sheet:0 -4px 20px rgba(17,18,20,.08)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:#2A2C30;color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;font-feature-settings:'tnum' 1,'cv11' 1;-webkit-font-smoothing:antialiased}
.phone{position:relative;max-width:430px;height:100%;margin:0 auto;background:var(--surface-page);overflow:hidden}
@media(min-width:520px){body{padding:24px 0}.phone{height:min(900px,calc(100vh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(0,0,0,.45)}}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:8px 12px 140px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:28px;line-height:32px;font-weight:700;letter-spacing:-.03em}
h2{margin:16px 8px -4px;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.grp{margin:12px 8px -4px;font-size:13px;font-weight:600;color:var(--ink-muted)}
.muted{color:var(--ink-muted)}.cap{font-size:13px;line-height:18px}.sm{font-size:14px;line-height:20px}
.b{font-weight:600}.ok{color:var(--ok)}.behind{color:var(--behind)}
.card{background:var(--surface-card);border-radius:16px;box-shadow:var(--shadow-card);padding:16px}
.row{display:flex;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:2px;flex:1}
.top{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 4px 0 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{height:52px;border-radius:12px;border:0;background:var(--yellow);font-size:16px;font-weight:600;width:100%;padding:0 16px}
.btn.sec{background:#fff;border:1.5px solid var(--line-control)}
.btn.s{height:44px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:12px 0;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.round{width:44px;height:44px;border-radius:22px;border:0;background:#fff;box-shadow:var(--shadow-card);display:grid;place-items:center;flex:none}
.round.veil{background:rgba(255,255,255,.16);box-shadow:none;color:#fff;width:40px;height:40px}
.ico{width:48px;height:48px;flex:none;border-radius:14px;background:var(--track);display:grid;place-items:center}
.ico svg{width:28px;height:28px}.ico.img{background:none;border-radius:0}.ico img{width:50px;height:50px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(60,40,0,.18))}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.P{background:var(--yellow)}.av.I{background:#EADBC0;color:var(--brass-darkest)}
.bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--brass);border-radius:3px}
.split{display:flex;gap:3px;height:6px}.split>span{border-radius:3px;overflow:hidden;background:rgba(255,255,255,.22)}.split>span>i{display:block;height:100%;background:#fff}
.splitc{display:flex;gap:3px;height:6px}.splitc>span{border-radius:3px}
.notice{background:var(--yellow-soft);border-radius:12px;padding:12px;display:flex;gap:12px;color:var(--notice-ink);font-size:14px;line-height:20px}
.notice svg{flex:none;color:var(--notice-icon)}
.divider{height:1px;background:var(--line-subtle);margin:0 -16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 6px;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(17,18,20,.06);font-weight:600;font-size:14px}
.flag{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--track);font-size:11px;font-weight:700;color:var(--brass-darkest);overflow:hidden}
.dash{border:1.5px dashed var(--line-control);border-radius:16px;background:none;min-height:56px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;width:100%}
/* tab bar */
.tabs{position:absolute;left:20px;right:20px;bottom:26px;height:64px;padding:6px;border-radius:32px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(18px) saturate(1.8);backdrop-filter:blur(18px) saturate(1.8);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 28px rgba(17,18,20,.14),inset 0 1px 0 rgba(255,255,255,.9);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;z-index:5}
.tab{border:0;background:transparent;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink-muted);font-size:11px;font-weight:500;position:relative}
.tab[aria-current=page]{background:var(--yellow);color:var(--ink);font-weight:600}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;line-height:18px;font-weight:700;box-shadow:0 0 0 2px #fff}
/* masthead */
.mast{position:relative;height:470px;border-radius:0 0 24px 24px;overflow:hidden;color:#fff;background:var(--masthead)}
.mast svg.scene{position:absolute;left:0;bottom:0;width:100%;height:auto}
.mast .in{position:relative;display:flex;flex-direction:column;align-items:center;padding:8px 16px 0;text-align:center}
.mast .amt{font-size:50px;line-height:1;font-weight:700;letter-spacing:-.04em;margin-top:10px}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(17,18,20,.5);z-index:10;display:flex;align-items:flex-end;animation:fade .2s}
.sheet{background:#fff;width:100%;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;box-shadow:var(--shadow-sheet);padding:8px 16px 28px;display:flex;flex-direction:column;gap:18px;animation:up .25s ease-out}
.grab{align-self:center;width:36px;height:5px;border-radius:3px;background:var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}}
.radio{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:var(--surface-page);border:0;text-align:left;width:100%}
.radio[aria-checked=true]{background:#fff;outline:2px solid var(--ink);outline-offset:-2px}
.radio .dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--line-control);background:#fff;flex:none;margin-top:1px}
.radio[aria-checked=true] .dot{border:7px solid var(--ink)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--yellow);margin-left:6px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:12px;background:#E6E9E8;isolation:isolate}
.seg::before{content:"";position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n,2));transform:translateX(calc(100% * var(--i,0)));border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(17,18,20,.08),0 3px 8px rgba(17,18,20,.12);transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.seg:not([style*="--i"])::before{opacity:0}
.seg button{position:relative;height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;transition:color .2s}
.seg button+button::after{content:"";position:absolute;left:0;top:11px;bottom:11px;width:1px;background:#C9CECC;transition:opacity .2s}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg button[aria-pressed=true]::after,.seg button[aria-pressed=true]+button::after{opacity:0}
.stepper{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-page)}
.stepper button{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line-control);background:#fff;flex:none;font-size:22px;line-height:1}
.field{height:48px;width:100%;border-radius:12px;border:1.5px solid var(--line-control);background:#fff;padding:0 14px;font-size:16px}
.money{display:flex;align-items:center;gap:4px;height:44px;padding:0 12px;border-radius:12px;background:var(--surface-page)}
.money input{border:0;background:transparent;width:100%;font-size:17px;font-weight:600;outline:none}
.switch{appearance:none;-webkit-appearance:none;margin:0;width:51px;height:31px;border-radius:16px;background:var(--line-control);position:relative;flex:none;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 1px 3px rgba(17,18,20,.25);transition:left .15s}
.switch:checked{background:var(--ink)}.switch:checked::after{left:22px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;background:#fff;border-radius:16px;box-shadow:var(--shadow-card);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.tile.on{outline:2px solid var(--yellow);outline-offset:-2px}
.tile .chk{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:12px;background:var(--yellow);display:grid;place-items:center}
.tile .ico{width:64px;height:64px;border-radius:18px}.tile .ico svg{width:36px;height:36px}.tile .ico img{width:64px;height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sheet>*{flex-shrink:0}
.sw{width:36px;height:36px;border-radius:18px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line-control);padding:0}.sw[aria-pressed=true]{box-shadow:0 0 0 2.5px var(--ink)}
.avsvg{display:block}.avbusy{position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}.spin{width:30px;height:30px;border-radius:50%;border:3px solid rgba(17,18,20,.15);border-top-color:var(--ink);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.avbtn{position:relative;border:0;background:none;padding:0;border-radius:50%;flex:none}.avbtn .pen{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:var(--shadow-card);display:grid;place-items:center}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--line-control);background:#fff;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow)}
.bottom{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:var(--shadow-sheet);padding:18px 16px 24px;display:flex;flex-direction:column;gap:10px;z-index:4}
.toast{position:absolute;left:16px;right:16px;bottom:104px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;z-index:20;font-size:14px;animation:up .2s}
.toast button{background:none;border:0;color:var(--yellow);font-weight:600;padding:8px 4px}
.splash{position:absolute;inset:0;top:env(safe-area-inset-top);background:#E9BE4E;z-index:30;display:grid;place-items:center}
.splash video{width:100%;height:100%;object-fit:cover}
.splash .skip{position:absolute;right:16px;top:16px;height:36px;padding:0 14px;border-radius:18px;border:0;background:rgba(255,255,255,.6);font-weight:600;font-size:14px}
.demo{font-size:12px;color:var(--ink-muted);text-align:center;margin-top:4px}
/* PWA additions */
html,body{height:100%;overscroll-behavior:none}
.phone{height:100dvh}
@media(min-width:520px){.phone{height:min(900px,calc(100dvh - 48px))}}
.pad{padding-top:calc(8px + env(safe-area-inset-top))}
.mast .in{padding-top:calc(8px + env(safe-area-inset-top))}
.mast{height:calc(470px + env(safe-area-inset-top))}
.tabs{bottom:max(12px,calc(env(safe-area-inset-bottom) - 14px))}
.bottom{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.toast{bottom:calc(104px + env(safe-area-inset-bottom))}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.auth{padding:calc(24px + env(safe-area-inset-top)) 16px 40px;display:flex;flex-direction:column;gap:16px;min-height:100%}
.authtop{text-align:center;padding:36px 0 12px}
.pv{background:#E8EEFF;color:#22408C;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;text-align:center}
.pv.off{background:var(--yellow-soft);color:var(--notice-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.codebox{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface-page)}
.code-big{font-size:22px;font-weight:700;letter-spacing:.18em}
.field.code{font-size:22px;letter-spacing:.3em;text-align:center;font-weight:700}
.scenebox{position:relative;height:110px;border-radius:14px;overflow:hidden;background:var(--masthead)}
.scenebox svg.scene{position:absolute;left:0;bottom:0;width:100%;height:auto}
details summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:44px}
details summary::after{content:"+";font-size:20px;color:var(--ink-muted)}details[open] summary::after{content:"–"}
details summary::-webkit-details-marker{display:none}
.link.behind{color:var(--behind)}
.setup{color:var(--brass-deep);font-weight:600;text-decoration:underline;text-underline-offset:2px}
/* on phones the page itself is the app: no dark frame behind the status bar */
html,body{background:var(--surface-page)}   /* light grey from the start: Safari and the home-screen app colour the status bar from this */
html.app,html.app body{background:var(--surface-page)}
@media(min-width:520px){html,body,html.app,html.app body{background:#2A2C30}}
.splash .skip{top:16px}
/* deposit marker on a part's progress bar */
.depmark{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--brass-darkest);border-radius:1px}
.bar:has(.depmark){overflow:visible}
/* lock the page: only the app's own scrolling areas move, never the whole page (no rubber-banding, no sideways drift, no pinch) */
html,body{position:fixed;inset:0;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
.scroll,.sheet{overflow-x:hidden;overscroll-behavior:none}
.phone{touch-action:pan-y}
/* bag avatars */
.av.bag{background:none;border-radius:0;overflow:visible;display:block}
.bagav{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(60,40,0,.18))}
.bagav.big{width:128px;height:128px;filter:drop-shadow(0 6px 10px rgba(60,40,0,.18))}
.mast .bagav,.card .bagav{filter:drop-shadow(0 2px 3px rgba(20,20,40,.25))}
.av.I{background:transparent;border:1.5px dashed var(--line-control);color:var(--ink-muted)}
.mast .av.I,[style*="masthead"] .av.I{border-color:rgba(255,255,255,.6);color:#fff}
.bagpick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bagpick button{height:76px;border-radius:14px;border:0;background:var(--surface-page);display:grid;place-items:center;padding:6px}
.bagpick button img{width:56px;height:56px}
.bagpick button[aria-pressed=true]{background:#fff;outline:2px solid var(--ink);outline-offset:-2px}
.avbtn .pen{right:-4px;bottom:2px}
/* light 3D scenes: picture along the bottom, its sky colour above, dark text */
img.scene{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;pointer-events:none}
.scenehead{position:relative;height:148px;overflow:hidden}
.mast{color:var(--ink);--on-mast-muted:#4A5058;--ok-mast:#137A3F}
.mast .round.veil{background:rgba(255,255,255,.75);color:var(--ink);box-shadow:0 1px 3px rgba(17,18,20,.08)}
.mast .split>span{background:rgba(17,18,20,.1)}.mast .split>span>i{background:var(--brass)}
.mast .av.I,.scenehead .av.I{border-color:var(--line-control);color:var(--ink-muted)}
.mast .bagav,.scenehead .bagav{filter:drop-shadow(0 2px 3px rgba(60,40,0,.18))}
.scenebox{background:#e8f9f7}
/* iOS date inputs ignore width:100% and overflow the card */
input[type=date].field{display:block;min-width:0;max-width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:left;line-height:45px}
input[type=date].field::-webkit-date-and-time-value{text-align:left;margin:0}
#topbar{position:fixed;top:0;left:0;right:0;height:max(env(safe-area-inset-top),12px);z-index:200;pointer-events:none;background:#F1F3F2}
@media(min-width:520px){#topbar{display:none}}
.amtin{display:inline-flex;align-items:baseline;justify-content:center;gap:1px;font-size:32px;line-height:36px;font-weight:700;letter-spacing:-.03em;padding:2px 10px;border-radius:10px;border-bottom:2px dashed var(--line-control);cursor:text}
.amtin input{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:transparent;padding:0;min-width:1.6ch;max-width:7ch;text-align:left;outline:none}
.amtin:focus-within{background:#fff;border-bottom-color:var(--ink)}
/* surprises */
.mystery{background:linear-gradient(160deg,#FFF7E0,#FDEBC0 60%,#F9DFA6)}
.mystery .gift{font-size:56px;line-height:1;animation:giftbob 2.4s ease-in-out infinite}
@keyframes giftbob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
#reveal{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;background:#111214;opacity:0;transition:opacity .3s}
#reveal.on{opacity:1}
#reveal .rv-scene{position:absolute;inset:0;display:flex;align-items:flex-end;overflow:hidden}
#reveal .rv-scene .scene{width:100%;height:48vh;object-fit:cover;object-position:bottom;filter:blur(24px) saturate(.6);transform:scale(1.15);transition:filter 1.6s ease .5s,transform 2s cubic-bezier(.2,.7,.2,1) .5s}
#reveal.on .rv-scene .scene{filter:none;transform:scale(1)}
#reveal .rv-in{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(40px + env(safe-area-inset-top)) 28px calc(28px + env(safe-area-inset-bottom));text-align:center;color:var(--ink)}
#reveal .rv-in>*{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s cubic-bezier(.2,.7,.2,1)}
#reveal.on .rv-from{opacity:1;transform:none;transition-delay:.3s}
#reveal.on .rv-place{opacity:1;transform:none;transition-delay:1.5s}
#reveal.on .rv-dates,#reveal.on .rv-hint{opacity:1;transform:none;transition-delay:2s}
#reveal.on .rv-bag{opacity:1;transform:none;transition-delay:2.3s}
#reveal.on .btn{opacity:1;transform:none;transition-delay:2.6s}
#reveal .rv-from{font-size:17px;font-weight:500;color:var(--ink-muted)}
#reveal .rv-place{font-size:44px;line-height:48px;font-weight:800;letter-spacing:-.04em}
#reveal .rv-dates{font-size:17px;font-weight:600}
#reveal .rv-hint{font-size:15px;background:rgba(255,255,255,.75);border-radius:12px;padding:8px 12px}
#reveal .rv-bag{margin-top:8px}
#reveal.on .rv-bag img,#reveal.on .rv-bag canvas{animation:baghop .7s cubic-bezier(.3,1.6,.5,1) 2.5s 2}
@keyframes baghop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) rotate(-6deg)}}
#reveal .btn{width:100%;max-width:340px;margin-top:auto}
#reveal::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.0),rgba(255,255,255,.55) 30%,rgba(255,255,255,.55) 55%,rgba(255,255,255,0) 75%);z-index:1;pointer-events:none}
#reveal .rv-in{z-index:2}

/* person card: owner header clearly above its parts */
.ownhd{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:4px;border-bottom:1px solid var(--line-subtle)}
.ownnm{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.ownpct{font-size:20px;font-weight:700;letter-spacing:-.01em;flex:none}
.prow .ico{width:48px;height:44px}.prow .ico img{width:44px;height:44px}
.pnm{font-size:15px;font-weight:500}.pam{font-size:15px;font-weight:600}
/* ---------- holiday finder ---------- */
.vibes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vibe{position:relative;border:0;padding:6px 6px 10px;border-radius:16px;background:#fff;display:flex;flex-direction:column;gap:8px;text-align:left;font-weight:600;font-size:14px;box-shadow:var(--shadow-card)}
.vibe img,.vibe .vimg{width:100%;height:64px;object-fit:cover;object-position:65% 100%;border-radius:12px;display:block}
.vibe>span:last-of-type{padding:0 4px}
.vibe.any{background:none;box-shadow:none;border:1.5px dashed var(--line-control)}
.vibe .vimg{display:grid;place-items:center;color:var(--ink-muted)}
.vibe[aria-pressed=true]{box-shadow:0 0 0 3px var(--yellow)}
.vtick{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:12px;background:var(--yellow);display:grid;place-items:center}
.fbig{font-size:44px;line-height:52px;font-weight:700;letter-spacing:-.03em;border:0;background:none;padding:0;width:100%;min-width:0;font-family:inherit;color:var(--ink);font-feature-settings:'tnum' 1}
.fbig:focus{outline:none}
.fsentence{margin:0;font-size:20px;line-height:36px;font-weight:600;letter-spacing:-.01em}
.fpill{border:0;background:var(--surface-page);border-radius:10px;padding:2px 8px;font:inherit;color:inherit;min-height:32px}
.fpill[aria-expanded=true]{background:var(--yellow)}
.fscene{position:relative;border-radius:24px;overflow:hidden}
.fscene>img,.fscene>.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%}
.fsteps{list-style:none;margin:0;display:flex;flex-direction:column;gap:14px}
.fsteps li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink-muted)}
.fsteps li>span:nth-child(2){flex:1}
.fsteps li.done,.fsteps li.now{color:var(--ink)}
.fsteps li.now{font-weight:600}
.fdot{width:28px;height:28px;border-radius:14px;border:1.5px solid var(--line-control);box-sizing:border-box;flex:none;display:grid;place-items:center}
.fdot.ok{background:var(--yellow);border:0}
.fspin{width:22px;height:22px;margin:3px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--brass);box-sizing:border-box;flex:none;animation:spin .8s linear infinite}
.irow-scroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;scrollbar-width:none;scroll-padding:0 16px;align-items:stretch}
.irow-scroll::-webkit-scrollbar{display:none}
.icard{flex:none;width:calc(100% - 64px);max-width:360px;scroll-snap-align:start;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 8px 28px rgba(17,18,20,.10),0 1px 2px rgba(17,18,20,.04);display:flex;flex-direction:column}
.ibody{padding:14px 16px 6px;display:flex;flex-direction:column;gap:12px;flex:1}
.ibar{display:flex;gap:3px;height:6px}
.ibar span{border-radius:3px}
.irow{gap:10px;font-size:15px}
.idot{width:10px;height:10px;border-radius:5px;flex:none}
.idots{display:flex;gap:6px;justify-content:center}
.idots span{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.idots span.on{width:18px;background:var(--ink)}
@media (prefers-reduced-motion: reduce){.fspin{animation:none}}
/* bottom navigation: one yellow pill that glides between tabs */
.tabs .tpill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 20px) / 3);border-radius:26px;background:var(--yellow);transform:translateX(calc(var(--i,0) * (100% + 4px)));transition:transform .6s cubic-bezier(.22,1,.36,1);z-index:0;will-change:transform,scale}
.tabs .tpill.grow{animation:pillGrow .6s cubic-bezier(.37,0,.2,1)}
@keyframes pillGrow{0%{scale:1}40%{scale:1.07 1.1}100%{scale:1}}
.tabs .tab{z-index:1;transition:color .25s ease}
.tabs .tab[aria-current=page]{background:transparent}
.tabs .tab svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.tabs .tab.pop svg{animation:tabPop .5s cubic-bezier(.34,1.56,.64,1)}
.tabs .tab:active svg{transform:scale(.88)}
@keyframes tabPop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.tabs .tpill,.tabs .tab,.tabs .tab svg{transition:none}.tabs .tpill.grow{animation:none}.tabs .tab.pop svg{animation:none}}
/* "Check your email": the bag gives a small hop when the screen opens */
.sent .sentbag{animation:sentHop .9s cubic-bezier(.34,1.56,.64,1) .1s both}
@keyframes sentHop{0%{transform:translateY(12px) scale(.9);opacity:0}60%{transform:translateY(-6px) scale(1.03);opacity:1}100%{transform:none}}
@media (prefers-reduced-motion: reduce){.sent .sentbag{animation:none}}
/* trip view: compact bar once the scene has scrolled away */
.minibar{position:fixed;left:0;right:0;top:max(env(safe-area-inset-top),12px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:rgba(241,243,242,.86);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border-bottom:1px solid var(--line-subtle);transform:translateY(-110%);opacity:0;transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .3s ease}
.minibar.on{transform:none;opacity:1}
.minibar .round{width:40px;height:40px}
.minititle{display:flex;align-items:center;gap:8px;font-size:16px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion: reduce){.minibar{transition:opacity .2s}}
/* toasts: frosted dark glass, sitting just above whatever is at the bottom of the screen */
.toast{bottom:calc(20px + env(safe-area-inset-bottom));background:rgba(17,18,20,.74);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:0 10px 30px rgba(17,18,20,.18);border:1px solid rgba(255,255,255,.08);animation:toastIn .45s cubic-bezier(.22,1,.36,1)}
#phone:has(#chrome .tabs) .toast{bottom:calc(78px + max(12px,calc(env(safe-area-inset-bottom) - 14px)))}
#phone:has(#chrome .bottom) .toast{bottom:calc(124px + env(safe-area-inset-bottom))}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}

</style>
</head>
<body>
<div id="topbar" aria-hidden="true"></div>
<div class="phone" id="phone"><div class="scroll" id="view"></div><div id="chrome"></div><div id="layer"></div></div>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
